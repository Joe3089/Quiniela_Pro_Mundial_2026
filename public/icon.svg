<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#050A18"/>
      <stop offset="50%"  stop-color="#000814"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="trophy-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFF5C0"/>
      <stop offset="35%"  stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#A86900"/>
    </linearGradient>
    <linearGradient id="trophy-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFE96B"/>
      <stop offset="45%"  stop-color="#FFC200"/>
      <stop offset="100%" stop-color="#B87A00"/>
    </linearGradient>
    <linearGradient id="blue-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22C55E"/>
      <stop offset="40%"  stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="gold-halo" cx="50%" cy="40%" r="35%">
      <stop offset="0%"   stop-color="#F5A500" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F5A500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" fill="url(#bg-grad)"/>

  <!-- Gold halo behind trophy -->
  <ellipse cx="60" cy="44" rx="28" ry="22" fill="url(#gold-halo)"/>

  <!-- Tricolor top accent bar -->
  <rect x="0" y="0" width="120" height="2.5" fill="url(#blue-accent)" opacity="0.9"/>

  <!-- "2" bold white -->
  <text x="6" y="96"
    font-family="Arial Black, Impact, 'Helvetica Neue', sans-serif"
    font-size="88" font-weight="900"
    fill="white" opacity="0.9">2</text>

  <!-- "6" bold white -->
  <text x="62" y="96"
    font-family="Arial Black, Impact, 'Helvetica Neue', sans-serif"
    font-size="88" font-weight="900"
    fill="white" opacity="0.9">6</text>

  <!-- Trophy cup body (raised slightly for better positioning) -->
  <path d="M44 18 h32 v10 h6 v12 a16 16 0 0 1-16 16 a16 16 0 0 1-16-16 V28 h6 z"
    fill="url(#trophy-body)" filter="url(#glow-soft)"/>

  <!-- Cup handles -->
  <path d="M44 30 h-8 a8 8 0 0 0 0 16 h4"
    fill="none" stroke="url(#trophy-gold)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M76 30 h8 a8 8 0 0 1 0 16 h-4"
    fill="none" stroke="url(#trophy-gold)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Star on cup -->
  <text x="60" y="44"
    font-family="Arial, sans-serif"
    font-size="10" text-anchor="middle"
    fill="#FFF5C0" opacity="0.9">★</text>

  <!-- Stem -->
  <rect x="57" y="56" width="6" height="11" rx="2" fill="url(#trophy-body)"/>

  <!-- Base layers -->
  <rect x="49" y="67" width="22" height="4.5" rx="2.2" fill="url(#trophy-body)"/>
  <rect x="43" y="71" width="34" height="5.5" rx="2.8" fill="url(#trophy-gold)" filter="url(#glow-strong)"/>

  <!-- "FIFA WC" text at bottom -->
  <text x="60" y="113"
    font-family="Arial Black, Impact, 'Helvetica Neue', sans-serif"
    font-size="9.5" font-weight="900"
    fill="white" text-anchor="middle" letter-spacing="2" opacity="0.85">FIFA WC</text>
</svg>
