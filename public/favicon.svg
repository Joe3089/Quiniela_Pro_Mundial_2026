<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0001B"/>
      <stop offset="50%" stop-color="#7B2FBE"/>
      <stop offset="100%" stop-color="#B5E317"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFC93C"/>
      <stop offset="100%" stop-color="#E6920A"/>
    </linearGradient>
  </defs>

  <!-- Black background -->
  <circle cx="50" cy="50" r="50" fill="#070710"/>

  <!-- Gradient ring border -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#ring)" stroke-width="4"/>

  <!-- "2" left -->
  <text x="17" y="72"
    font-family="Arial Black, Impact, 'Helvetica Neue', sans-serif"
    font-size="54" font-weight="900" fill="white" opacity="0.90">2</text>

  <!-- "6" right -->
  <text x="52" y="72"
    font-family="Arial Black, Impact, 'Helvetica Neue', sans-serif"
    font-size="54" font-weight="900" fill="white" opacity="0.90">6</text>

  <!-- Trophy cup body -->
  <path d="M37 24h26v7h5v9a13 13 0 01-13 13 13 13 0 01-13-13v-9h5z"
    fill="url(#gold)"/>
  <!-- Trophy stem -->
  <rect x="46" y="50" width="8" height="8" rx="1" fill="url(#gold)"/>
  <!-- Trophy base layers -->
  <rect x="40" y="58" width="20" height="4" rx="2" fill="url(#gold)"/>
  <rect x="35" y="62" width="30" height="5" rx="2.5" fill="url(#gold)"/>

  <!-- Lime accent dots on cup sides -->
  <circle cx="32" cy="38" r="4" fill="#B5E317" opacity="0.85"/>
  <circle cx="68" cy="38" r="4" fill="#B5E317" opacity="0.85"/>
</svg>
