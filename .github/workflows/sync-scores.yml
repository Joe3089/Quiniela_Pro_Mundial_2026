name: Auto-sync scores

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sync scores
        run: |
          curl -sf \
            -H "user-agent: vercel-cron/1.0" \
            -H "x-sync-secret: ${{ secrets.FOOTBALL_SYNC_SECRET }}" \
            "https://quiniela-pro-mundial-2026.vercel.app/api/football/sync?action=scores" \
            -o /tmp/sync-result.json && cat /tmp/sync-result.json || echo "sync completed"
